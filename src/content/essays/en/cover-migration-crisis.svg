  <rect x="24" y="204" width="32" height="2" fill="#7A3B2E" />
  <text x="24" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#142033">The Migration Crisis and the</text>
  <text x="24" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#142033">"Right to Have Rights"</text>
  <text x="24" y="252" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="9.5" fill="#7A3B2E">Hannah Arendt on statelessness and the nation-state</text>

