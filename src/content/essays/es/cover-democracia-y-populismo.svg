<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect x="0" y="0" width="400" height="300" fill="#EDECDF" />

  <text x="24" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2.5" fill="#5C5A2E">PAT</text>
  <text x="376" y="34" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="1.3" fill="#5C5A2E">ECONOMÍA POLÍTICA</text>

  <!-- cracked column -->
  <g stroke="#5C5A2E" stroke-width="1.3" fill="#F5F3E9" stroke-linejoin="round">
    <rect x="175" y="65" width="50" height="10" />
    <rect x="185" y="75" width="30" height="95" />
    <rect x="175" y="170" width="50" height="10" />
  </g>
  <path d="M200,60 L206,88 L193,113 L209,139 L191,163 L200,186" fill="none" stroke="#5C5A2E" stroke-width="1.4" />

  <!-- divided crowd -->
  <g fill="#5C5A2E" opacity="0.6">
    <circle cx="138" cy="196" r="3" />
    <circle cx="154" cy="196" r="3" />
    <circle cx="170" cy="196" r="3" />
    <circle cx="230" cy="196" r="3" />
    <circle cx="246" cy="196" r="3" />
    <circle cx="262" cy="196" r="3" />
  </g>

  <rect x="24" y="214" width="32" height="2" fill="#5C5A2E" />
  <text x="24" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#142033">Democracia y populismo</text>
  <text x="24" y="248" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="9.5" fill="#5C5A2E">Reflexiones críticas y la búsqueda</text>
  <text x="24" y="260" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="9.5" fill="#5C5A2E">de un equilibrio con la acracia</text>

  <rect x="0.5" y="0.5" width="399" height="299" fill="none" stroke="#5C5A2E" stroke-width="1" />
</svg>
