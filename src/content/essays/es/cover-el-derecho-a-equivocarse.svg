<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="spine-es" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A4632" stop-opacity="0.35" />
      <stop offset="0.5" stop-color="#5A4632" stop-opacity="0.65" />
      <stop offset="1" stop-color="#5A4632" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="#EDE6DA" />

  <!-- open book -->
  <polygon points="50,95 198,80 198,224 50,236" fill="#F5F0E6" stroke="#5A4632" stroke-width="1.25" />
  <polygon points="202,80 350,95 350,236 202,224" fill="#F5F0E6" stroke="#5A4632" stroke-width="1.25" />
  <rect x="197" y="76" width="6" height="152" fill="url(#spine-es)" />

  <!-- left page: censored lines -->
  <g fill="#3A2E22">
    <rect x="66" y="108" width="86" height="7" />
    <rect x="66" y="128" width="112" height="7" />
    <rect x="66" y="148" width="70" height="7" />
    <rect x="66" y="168" width="100" height="7" />
    <rect x="66" y="188" width="60" height="7" />
    <rect x="66" y="208" width="94" height="7" />
  </g>

  <!-- right page: free lines -->
  <g stroke="#5A4632" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <line x1="216" y1="107" x2="332" y2="104" />
    <line x1="216" y1="125" x2="322" y2="123" />
    <line x1="216" y1="143" x2="330" y2="142" />
    <line x1="216" y1="161" x2="310" y2="160" />
    <line x1="216" y1="179" x2="326" y2="179" />
    <line x1="216" y1="197" x2="300" y2="197" />
    <line x1="216" y1="215" x2="318" y2="216" />
  </g>

  <!-- quill crossing the book -->
  <g stroke="#5A4632" stroke-linecap="round">
    <path d="M92,246 C150,206 250,140 322,66" stroke-width="2.25" fill="none" />
    <path d="M322,66 L332,50 M322,66 L338,62 M322,66 L316,52" stroke-width="1.6" fill="none" />
    <circle cx="92" cy="246" r="2.4" fill="#5A4632" stroke="none" />
  </g>

  <text x="24" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2.5" fill="#5A4632">PAT</text>
  <text x="376" y="34" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.5" fill="#5A4632">FILOSOFÍA</text>

  <rect x="24" y="248" width="40" height="3" fill="#5A4632" />
  <text x="24" y="274" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#28211A">El derecho a equivocarse</text>
  <text x="24" y="292" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#5A4632">censura, verdad y domesticación del juicio</text>

  <rect x="0.5" y="0.5" width="399" height="299" fill="none" stroke="#5A4632" stroke-width="1" />
</svg>
