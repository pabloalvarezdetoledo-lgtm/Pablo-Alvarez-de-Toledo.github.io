<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect x="0" y="0" width="400" height="300" fill="#F1E5E0" />

  <text x="24" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2.5" fill="#7A3B2E">PAT</text>
  <text x="376" y="34" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="1.3" fill="#7A3B2E">LEGAL PHILOSOPHY</text>

  <!-- scroll -->
  <rect x="150" y="65" width="100" height="150" fill="#F8F0E6" stroke="#7A3B2E" stroke-width="1" />
  <ellipse cx="200" cy="65" rx="50" ry="8" fill="#F8F0E6" stroke="#7A3B2E" stroke-width="1" />
  <ellipse cx="200" cy="215" rx="50" ry="8" fill="#F8F0E6" stroke="#7A3B2E" stroke-width="1" />
  <line x1="150" y1="65" x2="150" y2="215" stroke="#7A3B2E" stroke-width="1" />
  <line x1="250" y1="65" x2="250" y2="215" stroke="#7A3B2E" stroke-width="1" />

  <g stroke="#7A3B2E" stroke-width="0.9" stroke-linecap="round" opacity="0.6">
    <line x1="165" y1="100" x2="235" y2="100" />
    <line x1="165" y1="111" x2="225" y2="111" />
    <line x1="165" y1="122" x2="232" y2="122" />
    <line x1="165" y1="133" x2="220" y2="133" />
    <line x1="165" y1="144" x2="230" y2="144" />
    <line x1="165" y1="155" x2="217" y2="155" />
  </g>

  <!-- wax seal -->
  <circle cx="200" cy="203" r="14" fill="#7A3B2E" />
  <path d="M192,203 a8,8 0 1,1 16,0 a8,8 0 1,1 -16,0" fill="none" stroke="#F1E5E0" stroke-width="1" />

  <!-- quill -->
  <g stroke="#7A3B2E" stroke-linecap="round">
    <path d="M98,213 C150,180 260,100 315,58" stroke-width="1.6" fill="none" />
    <path d="M315,58 L321,48 M315,58 L324,51 M315,58 L311,47" stroke-width="1" fill="none" />
    <circle cx="98" cy="213" r="1.6" fill="#7A3B2E" stroke="none" />
  </g>

  <rect x="24" y="232" width="32" height="2" fill="#7A3B2E" />
  <text x="24" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#142033">The Philosophical Foundations of</text>
  <text x="24" y="266" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#142033">Legal Personality</text>
  <text x="24" y="280" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="9.5" fill="#7A3B2E">On why the human being is an original subject of rights</text>

  <rect x="0.5" y="0.5" width="399" height="299" fill="none" stroke="#7A3B2E" stroke-width="1" />
</svg>
